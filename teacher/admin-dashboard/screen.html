<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
				background: #f5f7fb;
				color: #222;
			}

			h1 {
				margin: 0 0 24px;
				font-size: 24px;
				color: #1e293b;
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.toolbar {
				margin-bottom: 24px;
				padding: 20px;
				background: #f8fafc;
				border-radius: 12px;
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				align-items: center;
			}

			.create-form {
				display: flex;
				gap: 8px;
				align-items: center;
				margin-left: auto;
			}

			input[type="password"],
			input[type="text"] {
				padding: 9px 12px;
				border: 1px solid #d1d5db;
				border-radius: 8px;
				outline: none;
				font-size: 14px;
				transition: border-color 0.2s;
			}

			input:focus {
				border-color: #2563eb;
			}

			button {
				border: none;
				background: #2563eb;
				color: #fff;
				border-radius: 8px;
				padding: 10px 18px;
				cursor: pointer;
				font-size: 14px;
				font-weight: 500;
				transition: background 0.2s;
			}

			button:hover {
				background: #1d4ed8;
			}

			button.secondary {
				background: #64748b;
			}

			button.secondary:hover {
				background: #475569;
			}

			button.success {
				background: #059669;
			}

			button.success:hover {
				background: #047857;
			}

			table {
				width: 100%;
				border-collapse: collapse;
				margin-top: 10px;
			}

			th {
				background: #f8fafc;
				color: #64748b;
				font-weight: 600;
				text-align: left;
				padding: 14px 16px;
				border-bottom: 2px solid #e2e8f0;
			}

			td {
				padding: 14px 16px;
				border-bottom: 1px solid #f1f5f9;
				vertical-align: middle;
			}

			tr:hover td {
				background: #fcfdfe;
			}

			.status-box {
				padding: 14px;
				border-radius: 8px;
				margin-bottom: 20px;
				font-size: 14px;
				display: none;
			}

			.loading {
				background: #eff6ff;
				color: #1d4ed8;
				display: block;
			}
			.error {
				background: #fef2f2;
				color: #b91c1c;
				display: block;
			}
			.empty {
				background: #f9fafb;
				color: #6b7280;
				display: block;
			}
			.success-msg {
				background: #ecfdf5;
				color: #065f46;
				display: block;
			}
		</style>
	</head>
	<body>
		<div class="toolbar">
			<button class="secondary" onclick="loadScreens()">刷新列表</button>

			<div class="create-form">
				<input type="text" id="newScreenPwd" placeholder="输入新大屏初始密码" minlength="6" />
				<button class="success" onclick="createScreen()">创建新大屏</button>
			</div>
		</div>

		<div id="statusArea" class="status-box"></div>

		<div id="tableWrap" style="display: none">
			<table>
				<thead>
					<tr>
						<th style="width: 100px">ID</th>
						<th>重置密码</th>
						<th style="width: 120px">操作</th>
					</tr>
				</thead>
				<tbody id="screenTableBody"></tbody>
			</table>
		</div>

		<script>
			const API_BASE = "/system/admin-dashboard-screen.php";

			async function request(url, options = {}) {
				const response = await fetch(url, {
					credentials: "include",
					...options,
				});

				const text = await response.text();
				let data = null;

				try {
					data = JSON.parse(text);
				} catch (e) {
					throw new Error("服务端返回格式错误：" + text.substring(0, 50));
				}

				if (!response.ok || data.status !== "success") {
					throw new Error(data.message || "请求失败");
				}

				return data;
			}

			function setStatus(type, message) {
				const el = document.getElementById("statusArea");
				el.className = `status-box ${type}`;
				el.textContent = message;
				el.style.display = "block";
			}

			function hideStatus() {
				document.getElementById("statusArea").style.display = "none";
			}

			async function loadScreens() {
				document.getElementById("tableWrap").style.display = "none";
				setStatus("loading", "正在获取大屏清单...");

				try {
					const result = await request(`${API_BASE}?action=list`);
					const list = result.data || [];
					const tbody = document.getElementById("screenTableBody");

					if (!list.length) {
						tbody.innerHTML = "";
						setStatus("empty", "目前没有任何大屏帐号");
						return;
					}

					tbody.innerHTML = list
						.map(
							(item) => `
                    <tr>
                        <td><strong>#${item.Id}</strong></td>
                        <td>
                            <input
                                type="password"
                                id="pwd_${item.Id}"
                                placeholder="输入新密码 (至少6位)"
                                minlength="6"
                            />
                        </td>
                        <td>
                            <button onclick="updatePassword(${item.Id})">更新</button>
                        </td>
                    </tr>
                `,
						)
						.join("");

					hideStatus();
					document.getElementById("tableWrap").style.display = "block";
				} catch (err) {
					setStatus("error", "载入失败：" + err.message);
				}
			}

			async function createScreen() {
				const input = document.getElementById("newScreenPwd");
				const password = input.value.trim();

				if (!password) {
					alert("请输入初始密码");
					return;
				}

				if (password.length < 6) {
					alert("密码长度不能少于 6 位");
					return;
				}

				const formData = new FormData();
				formData.append("action", "create");
				formData.append("password", password);

				try {
					const result = await request(API_BASE, {
						method: "POST",
						body: formData,
					});
					alert(`创建成功！大屏 ID 为：${result.id}`);
					input.value = "";
					loadScreens(); // 重新整理列表
				} catch (err) {
					alert("创建失败：" + err.message);
				}
			}

			async function updatePassword(id) {
				const input = document.getElementById(`pwd_${id}`);
				const password = input.value.trim();

				if (!password) {
					alert("请输入新密码");
					return;
				}

				if (password.length < 6) {
					alert("密码长度不能少于 6 位");
					return;
				}

				const formData = new FormData();
				formData.append("action", "update_password");
				formData.append("id", id);
				formData.append("password", password);

				try {
					const result = await request(API_BASE, {
						method: "POST",
						body: formData,
					});
					alert("密码已更新");
					input.value = "";
				} catch (err) {
					alert("更新失败：" + err.message);
				}
			}

			// 初始化载入
			loadScreens();
		</script>
	</body>
</html>
